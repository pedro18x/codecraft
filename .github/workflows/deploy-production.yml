name: Deploy Production

on:
  push:
    tags:
      - 'v*'

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci
      - name: Type-check & lint frontend
        working-directory: apps/web
        run: npm run type-check && npm run lint -- --quiet
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Install API deps
        working-directory: apps/api
        run: npm ci
      - name: Build API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codecraft
        run: npm run db:generate && npm run build

  deploy-frontend-vercel:
    runs-on: ubuntu-latest
    needs: release-gate
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Validate required Vercel secrets
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "${{ secrets.VERCEL_ORG_ID }}" || (echo "Missing VERCEL_ORG_ID" && exit 1)
          test -n "${{ secrets.VERCEL_PROJECT_ID }}" || (echo "Missing VERCEL_PROJECT_ID" && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-api-render:
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - name: Validate deploy hooks
        run: |
          test -n "${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}" || (echo "Missing RENDER_API_DEPLOY_HOOK_URL" && exit 1)
          test -n "${{ secrets.RENDER_EXECUTOR_DEPLOY_HOOK_URL }}" || (echo "Missing RENDER_EXECUTOR_DEPLOY_HOOK_URL" && exit 1)
      - name: Trigger Render API deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}"
      - name: Trigger Render executor deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_EXECUTOR_DEPLOY_HOOK_URL }}"
